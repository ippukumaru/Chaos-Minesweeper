<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triangle Chaos Minesweeper</title>
  <style>
    :root {
      --bg: #0d0f18;
      --panel: #16192b;
      --accent: #ff0055;
      --cyan: #00f0ff;
      --text: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1 {
      margin: 10px 0 5px;
      color: var(--cyan);
      text-shadow: 0 0 10px var(--cyan);
      font-size: 1.8rem;
    }

    .info-panel {
      background: var(--panel);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      gap: 30px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .stat-box { text-align: center; }
    .stat-label { font-size: 0.75rem; color: #94a3b8; }
    .stat-value { font-size: 1.4rem; font-weight: bold; color: #fff; }

    .controls { margin-bottom: 15px; }

    button {
      background: linear-gradient(135deg, #ff0055, #ff5500);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 0, 85, 0.4);
      transition: transform 0.1s, filter 0.2s;
    }

    button:hover { filter: brightness(1.2); }
    button:active { transform: scale(0.95); }

    #board-container {
      background: var(--panel);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-width: 100%;
      overflow: auto;
    }

    /* SVGスタイリング */
    svg polygon {
      stroke: #0d0f18;
      stroke-width: 1.5;
      cursor: pointer;
      transition: fill 0.15s;
    }

    /* 上向き/下向きの未開示カラー */
    polygon.unrevealed-up { fill: #2a2e45; }
    polygon.unrevealed-down { fill: #1f2338; }
    polygon:hover { fill: #3d4363 !important; }

    /* 開封済み */
    polygon.revealed { fill: #0f1322 !important; }
    polygon.mine-revealed { fill: #4a0d21 !important; }

    /* セル内のテキスト（数値 / アイコン） */
    text.cell-text {
      font-weight: bold;
      font-size: 15px;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .num-0 { fill: #4a5568; }
    .num-1 { fill: #6366f1; }
    .num-2 { fill: #10b981; }
    .num-3 { fill: #ef4444; }
    .num-4 { fill: #f59e0b; }
    .num-5 { fill: #ec4899; }
    .num-6 { fill: #8b5cf6; }
    .num-error { fill: #00f0ff; filter: drop-shadow(0 0 3px #00f0ff); }

    #status-msg {
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      height: 1.5em;
      color: var(--accent);
    }

    .rules {
      margin-top: 20px;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.03);
      padding: 15px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <h1>🔺 Triangle Chaos Minesweeper</h1>

  <div class="info-panel">
    <div class="stat-box">
      <div class="stat-label">BOMBS</div>
      <div class="stat-value" id="mine-count">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">STATUS</div>
      <div class="stat-value" id="game-state">PLAYING</div>
    </div>
  </div>

  <div class="controls">
    <button onclick="initGame()">RESET GAME</button>
  </div>

  <div id="board-container">
    <svg id="board-svg"></svg>
  </div>

  <div id="status-msg"></div>

  <div class="rules">
    <strong>🌀 カオスルール & 三角幾何学:</strong>
    <ul>
      <li><strong>12マス判定</strong>: 正三角形の周囲「辺3マス ＋ 頂点9マス」の計12マスをカウント対象とします。</li>
      <li><strong>±1誤差表示 (30%の確率)</strong>: 数字表示時、30%の確率で±1ズレた偽数値が表示されます（水色発光）。</li>
      <li><strong>動く地雷 (5秒周期)</strong>: 5秒ごとに未開封マスの地雷が1つ裏でテレポートします。</li>
      <li><strong>操作</strong>: 左クリックで開封 / 右クリックでフラグ。</li>
    </ul>
  </div>

  <script>
    const ROWS = 9;
    const COLS = 13;
    const MINE_COUNT = 14;
    const SIDE = 54; // 三角形の1辺の長さ
    const HEIGHT = SIDE * (Math.sqrt(3) / 2); // 頂点の高さ

    let grid = [];
    let gameOver = false;
    let shiftInterval = null;

    // 幾何学的に正しい頂点座標の計算
    function getTriangleVertices(r, c) {
      const isUp = (r + c) % 2 === 0;
      const xBase = c * (SIDE / 2);
      const yBase = r * HEIGHT;

      let p1, p2, p3, center;

      if (isUp) {
        p1 = { x: xBase + SIDE / 2, y: yBase };
        p2 = { x: xBase + SIDE, y: yBase + HEIGHT };
        p3 = { x: xBase, y: yBase + HEIGHT };
        center = { x: xBase + SIDE / 2, y: yBase + (HEIGHT * 2 / 3) };
      } else {
        p1 = { x: xBase, y: yBase };
        p2 = { x: xBase + SIDE, y: yBase };
        p3 = { x: xBase + SIDE / 2, y: yBase + HEIGHT };
        center = { x: xBase + SIDE / 2, y: yBase + (HEIGHT / 3) };
      }

      return { points: `${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`, center, isUp };
    }

    // 周囲12マスの正確な抽出
    function get12Neighbors(r, c) {
      const isUp = (r + c) % 2 === 0;
      let neighbors = [];

      // 辺共有 (3マス)
      neighbors.push([r, c - 1], [r, c + 1]);
      neighbors.push(isUp ? [r + 1, c] : [r - 1, c]);

      // 頂点共有 (9マス)
      if (isUp) {
        neighbors.push([r - 1, c - 1], [r - 1, c], [r - 1, c + 1]);
        neighbors.push([r, c - 2], [r, c + 2]);
        neighbors.push([r + 1, c - 1], [r + 1, c + 1]);
        neighbors.push([r + 2, c]);
      } else {
        neighbors.push([r + 1, c - 1], [r + 1, c], [r + 1, c + 1]);
        neighbors.push([r, c - 2], [r, c + 2]);
        neighbors.push([r - 1, c - 1], [r - 1, c + 1]);
        neighbors.push([r - 2, c]);
      }

      return neighbors.filter(([nr, nc]) => nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS);
    }

    function initGame() {
      gameOver = false;
      document.getElementById('game-state').textContent = 'PLAYING';
      document.getElementById('status-msg').textContent = '';
      if (shiftInterval) clearInterval(shiftInterval);

      // SVG領域の設定
      const svg = document.getElementById('board-svg');
      const totalWidth = (COLS + 1) * (SIDE / 2);
      const totalHeight = ROWS * HEIGHT;
      svg.setAttribute('width', totalWidth);
      svg.setAttribute('height', totalHeight);
      svg.innerHTML = '';

      // データ構造の作成
      grid = [];
      for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
          const geo = getTriangleVertices(r, c);
          grid[r][c] = {
            r, c,
            isUp: geo.isUp,
            points: geo.points,
            center: geo.center,
            hasMine: false,
            revealed: false,
            flagged: false,
            displayVal: null,
            isLiar: false
          };
        }
      }

      // 地雷ランダム配置
      let placed = 0;
      while (placed < MINE_COUNT) {
        let r = Math.floor(Math.random() * ROWS);
        let c = Math.floor(Math.random() * COLS);
        if (!grid[r][c].hasMine) {
          grid[r][c].hasMine = true;
          placed++;
        }
      }

      document.getElementById('mine-count').textContent = MINE_COUNT;
      renderBoard();

      // 5秒周期の地雷テレポート
      shiftInterval = setInterval(shiftRandomMine, 5000);
    }

    function renderBoard() {
      const svg = document.getElementById('board-svg');
      svg.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = grid[r][c];

          // ポリゴン描画
          const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          poly.setAttribute('points', cell.points);

          if (cell.revealed) {
            poly.setAttribute('class', cell.hasMine ? 'revealed mine-revealed' : 'revealed');
          } else {
            poly.setAttribute('class', cell.isUp ? 'unrevealed-up' : 'unrevealed-down');
          }

          poly.addEventListener('click', () => revealCell(r, c));
          poly.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });

          svg.appendChild(poly);

          // テキスト描画（数字 / アイコン）
          if (cell.revealed || cell.flagged) {
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', cell.center.x);
            text.setAttribute('y', cell.center.y);
            text.setAttribute('class', 'cell-text');

            if (cell.revealed) {
              if (cell.hasMine) {
                text.textContent = '💥';
              } else {
                text.textContent = cell.displayVal;
                if (cell.isLiar) {
                  text.classList.add('num-error');
                } else {
                  text.classList.add(`num-${Math.min(cell.displayVal, 6)}`);
                }
              }
            } else if (cell.flagged) {
              text.textContent = '🚩';
            }

            svg.appendChild(text);
          }
        }
      }
    }

    function calculateNumber(r, c) {
      const neighbors = get12Neighbors(r, c);
      let realCount = 0;

      neighbors.forEach(([nr, nc]) => {
        if (grid[nr][nc].hasMine) realCount++;
      });

      const isLiar = Math.random() < 0.3; // 30%の確率で誤差が生じる
      let displayVal = realCount;

      if (isLiar) {
        const offset = Math.random() < 0.5 ? -1 : 1;
        displayVal = Math.max(0, realCount + offset);
      }

      return { displayVal, isLiar };
    }

    function revealCell(r, c) {
      if (gameOver) return;
      const cell = grid[r][c];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;

      if (cell.hasMine) {
        triggerGameOver(false);
        return;
      }

      const res = calculateNumber(r, c);
      cell.displayVal = res.displayVal;
      cell.isLiar = res.isLiar;

      // 連鎖開拓（数字0の場合）
      if (res.displayVal === 0) {
        const neighbors = get12Neighbors(r, c);
        neighbors.forEach(([nr, nc]) => {
          if (!grid[nr][nc].revealed) revealCell(nr, nc);
        });
      }

      checkWin();
      renderBoard();
    }

    function toggleFlag(r, c) {
      if (gameOver) return;
      const cell = grid[r][c];
      if (cell.revealed) return;
      cell.flagged = !cell.flagged;
      renderBoard();
    }

    function shiftRandomMine() {
      if (gameOver) return;

      let mines = [];
      let emptyCells = [];

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!grid[r][c].revealed) {
            if (grid[r][c].hasMine) mines.push(grid[r][c]);
            else emptyCells.push(grid[r][c]);
          }
        }
      }

      if (mines.length > 0 && emptyCells.length > 0) {
        const source = mines[Math.floor(Math.random() * mines.length)];
        const target = emptyCells[Math.floor(Math.random() * emptyCells.length)];

        source.hasMine = false;
        target.hasMine = true;

        const msg = document.getElementById('status-msg');
        msg.textContent = '⚠️ 地雷の位置がどこかへ移動しました…！';
        setTimeout(() => { if (!gameOver) msg.textContent = ''; }, 2000);
      }
    }

    function checkWin() {
      let won = true;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!grid[r][c].hasMine && !grid[r][c].revealed) {
            won = false;
            break;
          }
        }
      }
      if (won) triggerGameOver(true);
    }

    function triggerGameOver(isWin) {
      gameOver = true;
      clearInterval(shiftInterval);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c].hasMine) grid[r][c].revealed = true;
        }
      }

      renderBoard();
      document.getElementById('game-state').textContent = isWin ? 'VICTORY!' : 'GAME OVER';
      document.getElementById('status-msg').textContent = isWin
        ? '🎉 12マス＆嘘表示を乗り越えた！天才！'
        : '💥 爆破！地雷移動と偽数値のトラップにハマりました。';
    }

    // ゲーム開始
    initGame();
  </script>
</body>
</html>
