<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triangle Chaos Minesweeper</title>
  <style>
    :root {
      --bg: #0d0f18;
      --panel: #16192b;
      --accent: #ff0055;
      --cyan: #00f0ff;
      --text: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin: 5px 0 10px;
      color: var(--cyan);
      text-shadow: 0 0 10px var(--cyan);
      font-size: 1.6rem;
      text-align: center;
    }

    /* 設定パネル */
    .config-panel {
      background: var(--panel);
      border: 1px solid rgba(0, 240, 255, 0.2);
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      font-size: 0.85rem;
    }

    .config-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .config-group label {
      color: #94a3b8;
    }

    .config-group input, .config-group select {
      background: #0d0f18;
      border: 1px solid #334155;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      width: 60px;
      text-align: center;
    }

    .info-panel {
      background: var(--panel);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 10px 20px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      gap: 25px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .stat-box { text-align: center; }
    .stat-label { font-size: 0.7rem; color: #94a3b8; }
    .stat-value { font-size: 1.2rem; font-weight: bold; color: #fff; }

    button.action-btn {
      background: linear-gradient(135deg, #ff0055, #ff5500);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 0, 85, 0.4);
      transition: transform 0.1s, filter 0.2s;
    }

    button.action-btn:hover { filter: brightness(1.2); }
    button.action-btn:active { transform: scale(0.95); }

    #board-container {
      background: var(--panel);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-width: 100%;
      overflow: auto;
      position: relative;
    }

    #board-svg {
      display: block;
      margin: 0 auto;
    }

    text.cell-text {
      font-weight: bold;
      font-size: 15px;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .num-0 { fill: #4a5568; }
    .num-1 { fill: #6366f1; }
    .num-2 { fill: #10b981; }
    .num-3 { fill: #ef4444; }
    .num-4 { fill: #f59e0b; }
    .num-5 { fill: #ec4899; }
    .num-6 { fill: #8b5cf6; }
    .num-high { fill: #c084fc; }

    /* アクションポップアップメニュー */
    #action-menu {
      position: absolute;
      display: none;
      background: #1e2238;
      border: 2px solid var(--cyan);
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.7);
      z-index: 10;
      gap: 6px;
    }

    #action-menu button {
      background: #2a2e45;
      border: 1px solid #475569;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    #action-menu button:hover {
      background: var(--cyan);
      color: #0d0f18;
    }

    #status-msg {
      margin-top: 10px;
      font-size: 1rem;
      font-weight: bold;
      height: 1.5em;
      color: var(--accent);
      text-align: center;
    }

    .rules {
      margin-top: 15px;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <h1>🔺 Triangle Chaos Minesweeper</h1>

  <!-- 設定変更パネル -->
  <div class="config-panel">
    <div class="config-group">
      <label>行:</label>
      <input type="number" id="input-rows" value="9" min="5" max="15">
    </div>
    <div class="config-group">
      <label>列:</label>
      <input type="number" id="input-cols" value="13" min="5" max="25">
    </div>
    <div class="config-group">
      <label>地雷数:</label>
      <input type="number" id="input-mines" value="14" min="1" max="100">
    </div>
    <div class="config-group">
      <label>最大誤差:</label>
      <select id="input-error">
        <option value="0">±0 (正常)</option>
        <option value="1" selected>±1</option>
        <option value="2">±2</option>
      </select>
    </div>
    <button class="action-btn" onclick="initGame()">設定反映・リセット</button>
  </div>

  <div class="info-panel">
    <div class="stat-box">
      <div class="stat-label">REMAINING BOMBS</div>
      <div class="stat-value" id="mine-count">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">STATUS</div>
      <div class="stat-value" id="game-state">PLAYING</div>
    </div>
  </div>

  <div id="board-container">
    <svg id="board-svg"></svg>
    <!-- タップ時に出現するアクション選択メニュー -->
    <div id="action-menu">
      <button id="btn-dig">⛏️ 掘る</button>
      <button id="btn-flag">🚩 旗</button>
    </div>
  </div>

  <div id="status-msg"></div>

  <div class="rules">
    <strong>🌀 カオスルール:</strong>
    <ul>
      <li><strong>完全な偽装</strong>: 嘘つき数字も本物の数字と全く同じ見た目で表示されます。</li>
      <li><strong>12マス近傍</strong>: 周囲の辺3 ＋ 頂点9の計12マスを索敵します。</li>
      <li><strong>最初の安全保障</strong>: 初回クリック場所は必ず安全（爆弾なし）です。</li>
    </ul>
  </div>

  <script>
    let ROWS = 9;
    let COLS = 13;
    let MINE_COUNT = 14;
    let MAX_ERROR = 1;
    const SIDE = 50; 
    const HEIGHT = SIDE * (Math.sqrt(3) / 2);

    let grid = [];
    let gameOver = false;
    let firstClick = true;
    let selectedCell = null;

    function getTriangleVertices(r, c) {
      const isUp = (r + c) % 2 === 0;
      const xBase = c * (SIDE / 2);
      const yBase = r * HEIGHT;

      let p1, p2, p3, center;
      if (isUp) {
        p1 = { x: xBase + SIDE / 2, y: yBase };
        p2 = { x: xBase + SIDE, y: yBase + HEIGHT };
        p3 = { x: xBase, y: yBase + HEIGHT };
        center = { x: xBase + SIDE / 2, y: yBase + (HEIGHT * 2 / 3) };
      } else {
        p1 = { x: xBase, y: yBase };
        p2 = { x: xBase + SIDE, y: yBase };
        p3 = { x: xBase + SIDE / 2, y: yBase + HEIGHT };
        center = { x: xBase + SIDE / 2, y: yBase + (HEIGHT / 3) };
      }
      return { points: `${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`, center, isUp };
    }

    function get12Neighbors(r, c) {
      const isUp = (r + c) % 2 === 0;
      let neighbors = [];

      neighbors.push([r, c - 1], [r, c + 1]);
      neighbors.push(isUp ? [r + 1, c] : [r - 1, c]);

      if (isUp) {
        neighbors.push([r - 1, c - 1], [r - 1, c], [r - 1, c + 1]);
        neighbors.push([r, c - 2], [r, c + 2]);
        neighbors.push([r + 1, c - 1], [r + 1, c + 1]);
        neighbors.push([r + 2, c]);
      } else {
        neighbors.push([r + 1, c - 1], [r + 1, c], [r + 1, c + 1]);
        neighbors.push([r, c - 2], [r, c + 2]);
        neighbors.push([r - 1, c - 1], [r - 1, c + 1]);
        neighbors.push([r - 2, c]);
      }

      return neighbors.filter(([nr, nc]) => nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS);
    }

    function initGame() {
      ROWS = parseInt(document.getElementById('input-rows').value);
      COLS = parseInt(document.getElementById('input-cols').value);
      MINE_COUNT = parseInt(document.getElementById('input-mines').value);
      MAX_ERROR = parseInt(document.getElementById('input-error').value);

      const totalCells = ROWS * COLS;
      if (MINE_COUNT >= totalCells) {
        MINE_COUNT = Math.max(1, totalCells - 1);
        document.getElementById('input-mines').value = MINE_COUNT;
      }

      gameOver = false;
      firstClick = true;
      hideActionMenu();
      document.getElementById('game-state').textContent = 'PLAYING';
      document.getElementById('status-msg').textContent = '';

      const svg = document.getElementById('board-svg');
      const totalWidth = (COLS + 1) * (SIDE / 2);
      const totalHeight = ROWS * HEIGHT;
      svg.setAttribute('width', totalWidth);
      svg.setAttribute('height', totalHeight);
      svg.setAttribute('viewBox', `0 0 ${totalWidth} ${totalHeight}`);
      svg.innerHTML = '';

      grid = [];
      for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
          const geo = getTriangleVertices(r, c);
          grid[r][c] = {
            r, c,
            isUp: geo.isUp,
            points: geo.points,
            center: geo.center,
            hasMine: false,
            revealed: false,
            flagged: false,
            displayVal: null
          };
        }
      }

      document.getElementById('mine-count').textContent = MINE_COUNT;
      renderBoard();
    }

    // 初回タップ時に安全地帯（タップしたセル自身）を除外して地雷を正確に配給
    function placeMinesSafely(safeR, safeC) {
      let placed = 0;
      while (placed < MINE_COUNT) {
        let r = Math.floor(Math.random() * ROWS);
        let c = Math.floor(Math.random() * COLS);
        
        // 初回タップ位置以外で、まだ地雷がない場所に配置
        if ((r !== safeR || c !== safeC) && !grid[r][c].hasMine) {
          grid[r][c].hasMine = true;
          placed++;
        }
      }
    }

    function renderBoard() {
      const svg = document.getElementById('board-svg');
      svg.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = grid[r][c];

          const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          poly.setAttribute('points', cell.points);
          poly.setAttribute('stroke', '#0d0f18');
          poly.setAttribute('stroke-width', '1.5');
          poly.style.cursor = 'pointer';

          if (cell.revealed) {
            poly.setAttribute('fill', cell.hasMine ? '#4a0d21' : '#0f1322');
          } else {
            poly.setAttribute('fill', cell.isUp ? '#2a2e45' : '#1f2338');
          }

          poly.addEventListener('mouseenter', () => {
            if (!cell.revealed) poly.setAttribute('fill', '#3d4363');
          });
          poly.addEventListener('mouseleave', () => {
            if (!cell.revealed) poly.setAttribute('fill', cell.isUp ? '#2a2e45' : '#1f2338');
          });

          poly.addEventListener('click', (e) => {
            e.stopPropagation();
            if (gameOver) return;
            showActionMenu(r, c, cell.center);
          });

          poly.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (gameOver) return;
            toggleFlag(r, c);
            hideActionMenu();
          });

          svg.appendChild(poly);

          if (cell.revealed || cell.flagged) {
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', cell.center.x);
            text.setAttribute('y', cell.center.y);
            text.setAttribute('class', 'cell-text');

            if (cell.revealed) {
              if (cell.hasMine) {
                text.textContent = '💥';
              } else {
                text.textContent = cell.displayVal;
                const numClass = cell.displayVal <= 6 ? `num-${cell.displayVal}` : 'num-high';
                text.classList.add(numClass);
              }
            } else if (cell.flagged) {
              text.textContent = '🚩';
            }
            svg.appendChild(text);
          }
        }
      }
    }

    function showActionMenu(r, c, center) {
      if (grid[r][c].revealed) return;
      selectedCell = { r, c };
      const menu = document.getElementById('action-menu');
      menu.style.display = 'flex';
      menu.style.left = `${center.x - 40}px`;
      menu.style.top = `${center.y - 25}px`;
    }

    function hideActionMenu() {
      const menu = document.getElementById('action-menu');
      menu.style.display = 'none';
      selectedCell = null;
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#action-menu') && !e.target.closest('polygon')) {
        hideActionMenu();
      }
    });

    document.getElementById('btn-dig').addEventListener('click', () => {
      if (selectedCell) {
        revealCell(selectedCell.r, selectedCell.c);
        hideActionMenu();
      }
    });

    document.getElementById('btn-flag').addEventListener('click', () => {
      if (selectedCell) {
        toggleFlag(selectedCell.r, selectedCell.c);
        hideActionMenu();
      }
    });

    function calculateNumber(r, c) {
      const neighbors = get12Neighbors(r, c);
      let realCount = 0;
      neighbors.forEach(([nr, nc]) => {
        if (grid[nr][nc].hasMine) realCount++;
      });

      let displayVal = realCount;

      if (MAX_ERROR > 0) {
        if (Math.random() < 0.4) {
          const offset = (Math.random() < 0.5 ? 1 : -1) * Math.ceil(Math.random() * MAX_ERROR);
          displayVal = Math.max(0, realCount + offset);
        }
      }
      return displayVal;
    }

    function revealCell(r, c) {
      if (gameOver) return;
      const cell = grid[r][c];
      if (cell.revealed || cell.flagged) return;

      // 初回タップ時に安全を確定して地雷配置
      if (firstClick) {
        placeMinesSafely(r, c);
        firstClick = false;
      }

      cell.revealed = true;

      if (cell.hasMine) {
        triggerGameOver(false);
        return;
      }

      cell.displayVal = calculateNumber(r, c);

      // 表示数字が0なら連鎖展開
      if (cell.displayVal === 0) {
        const neighbors = get12Neighbors(r, c);
        neighbors.forEach(([nr, nc]) => {
          if (!grid[nr][nc].revealed) revealCell(nr, nc);
        });
      }

      checkWin();
      renderBoard();
    }

    function toggleFlag(r, c) {
      if (gameOver) return;
      const cell = grid[r][c];
      if (cell.revealed) return;
      cell.flagged = !cell.flagged;
      renderBoard();
    }

    function checkWin() {
      let won = true;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!grid[r][c].hasMine && !grid[r][c].revealed) {
            won = false;
            break;
          }
        }
      }
      if (won) triggerGameOver(true);
    }

    function triggerGameOver(isWin) {
      gameOver = true;
      hideActionMenu();

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c].hasMine) grid[r][c].revealed = true;
        }
      }

      renderBoard();
      document.getElementById('game-state').textContent = isWin ? 'VICTORY!' : 'GAME OVER';
      document.getElementById('status-msg').textContent = isWin
        ? '🎉 嘘まみれの罠を完全看破！クリアおめでとう！'
        : '💥 爆破されました！';
    }

    initGame();
  </script>
</body>
</html>
